name: Build and publish to GHCR

on:
  push:
    branches:
      - develop
      - release/*
    paths:
      - ".github/workflows/ghcr-release.yml"
      - "ansible/vars.yml"
      - "nix/ext/**"
      - "nix/packages/**"
      - "nix/postgresql/**"
      - "nix/config.nix"
      - "Dockerfile-15"
      - "Dockerfile-17"
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix_config: ${{ steps.set-matrix.outputs.matrix_config }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # v4.3.1
      - uses: ./.github/actions/nix-install-ephemeral
      - name: Generate build matrix
        id: set-matrix
        run: |
          nix run nixpkgs#nushell -- -c 'let versions = (open ansible/vars.yml | get postgres_major)
          let matrix = ($versions | each { |ver|
            let version = ($ver | str trim)
            let dockerfile = $"Dockerfile-($version)"
            if ($dockerfile | path exists) {
              {
                version: $version,
                dockerfile: $dockerfile
              }
            } else {
              null
            }
          } | compact)

          let matrix_config = {
            include: $matrix
          }

          $"matrix_config=($matrix_config | to json -r)" | save --append $env.GITHUB_OUTPUT'

  build_and_push:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJson(needs.prepare.outputs.matrix_config).include }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'large-linux-x86' || 'large-linux-arm' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # v4.3.1

      - uses: ./.github/actions/nix-install-ephemeral

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@v3 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tag
        id: image
        run: |
          nix run nixpkgs#nushell -- -c '
            let version = "${{ matrix.postgres.version }}"
            let release_key = if ($version | str contains "orioledb") {
              $"postgresorioledb-17"
            } else {
              $"postgres($version)"
            }
            let pg_version = (open ansible/vars.yml | get postgres_release | get $release_key | str trim)
            $"pg_version=($pg_version)" | save --append $env.GITHUB_OUTPUT
          '

      - name: Build and push
        uses: docker/build-push-action@v6 # v6.19.2
        with:
          context: .
          push: true
          target: production
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.pg_version }}_${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=ghcr-${{ matrix.postgres.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.postgres.version }}-${{ matrix.arch }}
          file: ${{ matrix.postgres.dockerfile }}

  merge_manifests:
    needs: [prepare, build_and_push]
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix_config).include }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # v4.3.1

      - uses: ./.github/actions/nix-install-ephemeral

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@v3 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tag
        id: get_version
        run: |
          nix run nixpkgs#nushell -- -c '
            let version = "${{ matrix.version }}"
            let release_key = if ($version | str contains "orioledb") {
              $"postgresorioledb-17"
            } else {
              $"postgres($version)"
            }
            let pg_version = (open ansible/vars.yml | get postgres_release | get $release_key | str trim)
            $"pg_version=($pg_version)" | save --append $env.GITHUB_OUTPUT
          '

      - name: Merge multi-arch manifests
        env:
          TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.pg_version }}
        run: |
          docker buildx imagetools create -t "${TAG}" \
            "${TAG}_amd64" \
            "${TAG}_arm64"

      - name: Tag as latest for this PG version
        env:
          VERSIONED_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.pg_version }}
          LATEST_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-pg${{ matrix.version }}
        run: |
          docker buildx imagetools create -t "${LATEST_TAG}" "${VERSIONED_TAG}"

  tag_latest:
    needs: [prepare, merge_manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # v4.3.1

      - uses: ./.github/actions/nix-install-ephemeral

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@v3 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag PG15 as latest
        run: |
          pg_version=$(nix run nixpkgs#nushell -- -c '
            open ansible/vars.yml | get postgres_release | get postgres15 | str trim
          ')
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${pg_version}"
